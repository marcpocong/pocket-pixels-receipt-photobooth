name: Production Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RESULTS_DIR: ${{ github.workspace }}/TestResults
      # Ad-hoc "Sign to Run Locally" simulator signing. It needs no certificate or team, but unlike
      # CODE_SIGNING_ALLOWED=NO it embeds the app's simulator entitlements, without which every
      # Keychain call fails with errSecMissingEntitlement and the operator-credential tests (which
      # correctly fail closed) cannot pass.
      SIGNING_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
    steps:
      - uses: actions/checkout@v4

      - name: Select and boot one iPad simulator
        run: |
          # Newest available iOS runtime; prefer an 11-inch iPad Pro, then any iPad. Deterministic
          # for a given runner image.
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e '
            data = JSON.parse(STDIN.read)["devices"]
            runtimes = data.keys.select { |k| k.include?("SimRuntime.iOS-") }
                                .sort_by { |k| k[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) }.reverse
            runtimes.each do |runtime|
              ipads = data[runtime].select { |d| d["name"].start_with?("iPad") }
              next if ipads.empty?
              device = ipads.find { |d| d["name"].start_with?("iPad Pro 11-inch") } || ipads.first
              STDERR.puts "Using #{device["name"]} on #{runtime}"
              puts device["udid"]
              exit 0
            end
            abort "No iPad simulator available"')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Generate synthetic gallery browser fixtures
        run: node Backend/GoogleAppsScript/GridSixValidation.test.cjs --fixtures

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PocketPixelsBooth.xcodeproj -scheme PocketPixelsBooth \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RESULTS_DIR/Build.xcresult" \
            $SIGNING_FLAGS

      - name: Run XCTest production suite
        run: |
          set -o pipefail
          # One booted simulator, tests in order: the suite is CPU-heavy (hundreds of real receipt
          # compositions) and cloned simulators on a 3-core runner previously failed to launch
          # the test host. Hung XCTest cases fail with a diagnostic instead of a job timeout.
          xcodebuild test-without-building \
            -project PocketPixelsBooth.xcodeproj -scheme PocketPixelsBooth \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RESULTS_DIR/Tests.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            $SIGNING_FLAGS

      - name: Summarize test failures
        if: failure()
        run: |
          for bundle in "$RESULTS_DIR/Build.xcresult" "$RESULTS_DIR/Tests.xcresult"; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" --compact > "$bundle.summary.json" 2>/dev/null || continue
            ruby -rjson -e '
              summary = JSON.parse(File.read(ARGV[0]))
              puts "### #{File.basename(ARGV[0], ".summary.json")}: #{summary["result"]}"
              puts "Passed #{summary["passedTests"]}, failed #{summary["failedTests"]}, skipped #{summary["skippedTests"]}"
              (summary["testFailures"] || []).each do |failure|
                puts "- **#{failure["testIdentifierString"] || failure["testName"]}**: #{failure["failureText"]}"
              end' "$bundle.summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ ! -d "$RESULTS_DIR/Tests.xcresult" ]; then
            echo "### Build failed before tests ran; see Build.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect simulator diagnostics
        if: failure()
        run: |
          mkdir -p "$RESULTS_DIR/CrashReports"
          find ~/Library/Logs/DiagnosticReports -name "PocketPixelsBooth*" -mmin -90 -exec cp {} "$RESULTS_DIR/CrashReports/" \; 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Payments Worker tests
        working-directory: Backend/PaymentsWorker
        run: |
          npm ci
          npm test
      - name: Gallery Worker tests
        working-directory: Backend/CloudflareGalleryProxy
        run: npm test
      - name: Apps Script pure checks
        run: node Backend/GoogleAppsScript/GridSixValidation.test.cjs
