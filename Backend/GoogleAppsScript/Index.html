<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Made to Keep Studios Gallery</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171313;
      --muted: #6f6262;
      --paper: #fffaf7;
      --maroon: #7b1f2b;
      --line: #e6dddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px 18px 44px;
    }

    header {
      text-align: center;
      padding: 18px 0 26px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0;
    }

    h2 {
      margin: 8px 0 0;
      color: var(--maroon);
      font-size: 18px;
      font-weight: 700;
    }

    .date,
    .privacy {
      color: var(--muted);
      line-height: 1.45;
    }

    .gallery {
      display: grid;
      gap: 22px;
      padding: 24px 0;
    }

    figure {
      margin: 0;
      padding: 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--maroon);
      color: white;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .error {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
<? if (!gallery) { ?>
  <main class="error">
    <section>
      <h1>Made to Keep Studios</h1>
      <h2>Gallery not found</h2>
      <p class="privacy">This gallery link is missing, invalid, or no longer available.</p>
    </section>
  </main>
<? } else { ?>
  <main>
    <header>
      <h1>Made to Keep Studios</h1>
      <h2>Receipt Photobooth</h2>
      <p class="date"><?= escapeHTML(gallery.createdAt) ?></p>
    </header>

    <section class="gallery" aria-label="Made to Keep Studios photo gallery">
      <? for (var i = 0; i < gallery.photos.length; i++) { ?>
        <figure>
          <img src="<?= getGalleryImage(gallery.galleryToken, gallery.photos[i]) ?>" alt="Made to Keep Studios photo <?= i + 1 ?>">
          <figcaption>
            <span>Photo <?= i + 1 ?></span>
            <a class="button" download="<?= escapeHTML(gallery.photos[i]) ?>" href="<?= getGalleryImage(gallery.galleryToken, gallery.photos[i]) ?>">Download</a>
          </figcaption>
        </figure>
      <? } ?>

      <figure>
        <img src="<?= getGalleryImage(gallery.galleryToken, gallery.receipt) ?>" alt="Made to Keep Studios composed receipt">
        <figcaption>
          <span>Receipt</span>
          <a class="button" download="<?= escapeHTML(gallery.receipt) ?>" href="<?= getGalleryImage(gallery.galleryToken, gallery.receipt) ?>">Download Receipt</a>
        </figcaption>
      </figure>
    </section>

    <p class="privacy">Anyone with this private gallery link can view these images. Made to Keep Studios does not require customer Google sign-in for this gallery.</p>
  </main>
<? } ?>
</body>
</html>
